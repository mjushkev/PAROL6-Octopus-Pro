[platformio]
default_envs = octopus_h723_identity
boards_dir = boards

[env:octopus_h723_identity]
platform = ststm32@19.7.1
platform_packages =
    framework-arduinoststm32@4.21200.0
    toolchain-gccarmnoneeabi@1.120301.0
board = octopus_pro_v1_1_h723
framework = arduino
board_build.flash_offset = 0x20000
board_upload.offset_address = 0x08020000
build_src_filter =
    +<main.cpp>
    +<identity_protocol.cpp>
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -DARDUINO_GENERIC_H723ZETX
    -DUSBCON
    -DUSBD_USE_CDC
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSE_USB_HS
    -DUSE_USB_HS_IN_FS
    -DHWSERIAL_NONE
    -DHAL_DAC_MODULE_DISABLED
    -DHAL_ETH_MODULE_DISABLED
    -DHAL_OSPI_MODULE_DISABLED
    -DHAL_SD_MODULE_DISABLED
    '-DUSB_MANUFACTURER_STRING="PAROL6 Project"'
    '-DUSB_PRODUCT_STRING="PAROL6 H723 Safe Identity"'
    '-DPAROL6_FIRMWARE_VERSION="0.1.0-identity"'
    '-DPAROL6_BOARD_NAME="BTT_OCTOPUS_PRO_V1_1_H723ZE"'
extra_scripts = post:scripts/verify_firmware.py
lib_deps =
lib_ldf_mode = off
monitor_speed = 3000000

[env:octopus_h723_safe_core]
platform = ststm32@19.7.1
platform_packages =
    framework-arduinoststm32@4.21200.0
    toolchain-gccarmnoneeabi@1.120301.0
board = octopus_pro_v1_1_h723
framework = arduino
board_build.flash_offset = 0x20000
board_upload.offset_address = 0x08020000
build_src_filter =
    +<safe_core_main.cpp>
    +<safe_core.cpp>
    +<safe_core_protocol.cpp>
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -DARDUINO_GENERIC_H723ZETX
    -DUSBCON
    -DUSBD_USE_CDC
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSE_USB_HS
    -DUSE_USB_HS_IN_FS
    -DHWSERIAL_NONE
    -DHAL_IWDG_MODULE_ENABLED
    -DHAL_DAC_MODULE_DISABLED
    -DHAL_ETH_MODULE_DISABLED
    -DHAL_OSPI_MODULE_DISABLED
    -DHAL_SD_MODULE_DISABLED
    '-DUSB_MANUFACTURER_STRING="PAROL6 Project"'
    '-DUSB_PRODUCT_STRING="PAROL6 H723 Safe Core"'
    '-DPAROL6_FIRMWARE_VERSION="0.2.0-safe-core"'
    '-DPAROL6_BOARD_NAME="BTT_OCTOPUS_PRO_V1_1_H723ZE"'
extra_scripts = post:scripts/verify_firmware.py
lib_deps =
lib_ldf_mode = off
monitor_speed = 3000000

[env:octopus_h723_service_core]
platform = ststm32@19.7.1
platform_packages =
    framework-arduinoststm32@4.21200.0
    toolchain-gccarmnoneeabi@1.120301.0
board = octopus_pro_v1_1_h723
framework = arduino
board_build.flash_offset = 0x20000
board_upload.offset_address = 0x08020000
# The 512 KiB H723ZE has four 128 KiB sectors. Sector 0 is the BTT
# bootloader, sector 1 is this application, and sectors 2-3 are persistent
# dual slots. PlatformIO subtracts flash_offset from maximum_size when it
# generates the linker script: 0x40000 - 0x20000 = 0x20000 application limit.
board_upload.maximum_size = 262144
build_src_filter =
    +<service_core_main.cpp>
    +<safe_core.cpp>
    +<binary_protocol.cpp>
    +<persistent_store.cpp>
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -DARDUINO_GENERIC_H723ZETX
    -DUSBCON
    -DUSBD_USE_CDC
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSE_USB_HS
    -DUSE_USB_HS_IN_FS
    -DHWSERIAL_NONE
    -DHAL_IWDG_MODULE_ENABLED
    -DHAL_DAC_MODULE_DISABLED
    -DHAL_ETH_MODULE_DISABLED
    -DHAL_OSPI_MODULE_DISABLED
    -DHAL_SD_MODULE_DISABLED
    '-DUSB_MANUFACTURER_STRING="PAROL6 Project"'
    '-DUSB_PRODUCT_STRING="PAROL6 H723 Service Core"'
    '-DPAROL6_FIRMWARE_VERSION="0.3.0-service-core"'
    '-DPAROL6_BOARD_NAME="BTT_OCTOPUS_PRO_V1_1_H723ZE"'
extra_scripts = post:scripts/verify_firmware.py
lib_deps =
lib_ldf_mode = off
monitor_speed = 3000000
