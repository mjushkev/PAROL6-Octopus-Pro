[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pinokin"
version = "0.1.8"
description = "Portable Python compatibility build of Pinokin 0.1.8"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "numba>=0.60", "scipy>=1.11"]

[project.urls]
Repository = "https://github.com/Jepson2k/pinokin"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "ty", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter
